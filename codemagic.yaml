# Codemagic CI/CD — compila "¿Quién va?" para iOS en un Mac en la nube y la sube
# a App Store Connect SIN que tengas un Mac.
#
# QUÉ TIENES QUE HACER EN CODEMAGIC (una vez), ver pasos detallados en APP_STORE_GUIDE.md:
#   1) Conecta tu repo de GitHub.
#   2) Ajustes → Integrations → App Store Connect: sube tu API Key (.p8 + Key ID + Issuer ID).
#      Guarda esa integración con el nombre:  quienva_appstore
#   3) Lanza el workflow "ios-quienva".
#
# La primera vez, Codemagic crea el certificado y el perfil automáticamente con tu API Key.

workflows:
  ios-quienva:
    name: "¿Quién va? iOS (App Store)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: quienva_appstore   # <-- nombre de la integración que creas en el paso 2
    environment:
      groups:
        - signing            # <-- grupo con la variable CERTIFICATE_PRIVATE_KEY (ver pasos)
      vars:
        BUNDLE_ID: "me.quienva.app"
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6804396475        # Apple ID numérico de la app (App Store Connect → Información de la app)
        # URL del backend de producción. SIN esto la app iOS se compila sin saber
        # dónde está el servidor (en Vercel la inyecta Vercel; aquí hay que darla).
        REACT_APP_BACKEND_URL: "https://quienva.onrender.com"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias web
        script: |
          cd frontend
          yarn install --frozen-lockfile
      - name: Compilar la web (build/)
        script: |
          cd frontend
          echo "Compilando con REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL"
          if [ -z "$REACT_APP_BACKEND_URL" ]; then echo "ERROR: falta REACT_APP_BACKEND_URL"; exit 1; fi
          REACT_APP_BACKEND_URL="$REACT_APP_BACKEND_URL" CI=false GENERATE_SOURCEMAP=false yarn build
      - name: Añadir y sincronizar iOS
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
      - name: Iconos y splash (si existen los assets)
        script: |
          cd frontend
          if [ -f assets/icon.png ]; then \
            npx capacitor-assets generate --ios \
              --iconBackgroundColor '#0A0A0C' --splashBackgroundColor '#0A0A0C' || true; \
          fi
          # El splash 2732x2732 decodificado pesa ~29.9MB y supera el límite de
          # iOS para launch images (25MB) → iOS lo rechaza y la pantalla de
          # arranque falla. Lo reducimos a máx 2000px (≈16MB decodificado).
          SPLASH_DIR="ios/App/App/Assets.xcassets/Splash.imageset"
          if [ -d "$SPLASH_DIR" ]; then \
            for f in "$SPLASH_DIR"/*.png; do \
              [ -f "$f" ] && sips -Z 2000 "$f" || true; \
            done; \
          fi
          npx cap sync ios
      - name: Ajustes Info.plist (encriptación + permiso de contactos) y solo-iPhone
        script: |
          PLIST="frontend/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption NO" "$PLIST"
          CONTACTS_MSG="Usamos tus contactos solo para ayudarte a encontrar amigos que ya usan ¿Quién va? e invitar a los que no. Nunca guardamos tu agenda."
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string $CONTACTS_MSG" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSContactsUsageDescription $CONTACTS_MSG" "$PLIST"
          # App SOLO para iPhone (evita tener que subir capturas de iPad)
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?1,2"?/TARGETED_DEVICE_FAMILY = "1"/g' frontend/ios/App/App.xcodeproj/project.pbxproj
      - name: Preparar firma (automática con tu API Key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key @env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          # Apuntar SOLO al proyecto de la app (evita el conflicto con Pods.xcodeproj)
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Número de build automático
        script: |
          cd frontend/ios/App
          # Número de build = hora Unix (segundos). Siempre creciente y único,
          # así nunca colisiona con un build ya subido (evita el error 409
          # "bundle version must be higher"). Cabe de sobra bajo el límite de
          # Apple (< 4.294.967.295) hasta el año 2106.
          BUILD_NO=$(date +%s)
          echo "Usando número de build: $BUILD_NO"
          agvtool new-version -all "$BUILD_NO"
      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Solo SUBE el build a App Store Connect (queda listo para seleccionar en
        # la versión y enviar a revisión manualmente). No lo manda a TestFlight,
        # así no exige rellenar la "Información de pruebas" de la beta.
        submit_to_testflight: false
        # submit_to_app_store: false     # cámbialo a true si quieres que Codemagic lo envíe a revisión solo
