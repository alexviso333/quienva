# Codemagic CI/CD — compila "¿Quién va?" para iOS en un Mac en la nube y la sube
# a App Store Connect SIN que tengas un Mac.
#
# QUÉ TIENES QUE HACER EN CODEMAGIC (una vez), ver pasos detallados en APP_STORE_GUIDE.md:
#   1) Conecta tu repo de GitHub.
#   2) Ajustes → Integrations → App Store Connect: sube tu API Key (.p8 + Key ID + Issuer ID).
#      Guarda esa integración con el nombre:  quienva_appstore
#   3) Lanza el workflow "ios-quienva".
#
# La primera vez, Codemagic crea el certificado y el perfil automáticamente con tu API Key.

workflows:
  ios-quienva:
    name: "¿Quién va? iOS (App Store)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: quienva_appstore   # <-- nombre de la integración que creas en el paso 2
    environment:
      groups:
        - signing            # <-- grupo con la variable CERTIFICATE_PRIVATE_KEY (ver pasos)
      vars:
        BUNDLE_ID: "me.quienva.app"
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Versión visible en la App Store (CFBundleShortVersionString). Para CADA
        # actualización, súbela aquí (1.1 -> 1.2 -> ...). Debe ser mayor que la
        # versión ya publicada. El número de build interno se pone solo (abajo).
        APP_VERSION: "1.2"
        APP_STORE_APPLE_ID: 6804396475        # Apple ID numérico de la app (App Store Connect → Información de la app)
        # URL del backend de producción. SIN esto la app iOS se compila sin saber
        # dónde está el servidor (en Vercel la inyecta Vercel; aquí hay que darla).
        REACT_APP_BACKEND_URL: "https://quienva.onrender.com"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias web
        script: |
          cd frontend
          yarn install --frozen-lockfile
      - name: Compilar la web (build/)
        script: |
          cd frontend
          echo "Compilando con REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL"
          if [ -z "$REACT_APP_BACKEND_URL" ]; then echo "ERROR: falta REACT_APP_BACKEND_URL"; exit 1; fi
          REACT_APP_BACKEND_URL="$REACT_APP_BACKEND_URL" CI=false GENERATE_SOURCEMAP=false yarn build
      - name: Añadir y sincronizar iOS
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
      - name: Iconos y splash + garantizar limite de 25MB en launch images
        script: |
          cd frontend
          # 1) Generar iconos y splash a partir de assets/ (si existen).
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --ios \
              --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || true
          fi
          # 2) CRITICO (motivo del rechazo de App Store / pantalla negra):
          #    iOS rechaza cualquier "launch image" cuyo tamano DECODIFICADO
          #    (ancho*alto*4 bytes) supere 25MB. El splash 2732x2732 = 29.9MB.
          #    Reducimos a 2000px (2000*2000*4 = 16MB) CUALQUIER png grande dentro
          #    de Assets.xcassets, venga de capacitor-assets o de la plantilla por
          #    defecto de Capacitor. Asi NUNCA queda un launch image sobre el limite.
          XC="ios/App/App/Assets.xcassets"
          if [ -d "$XC" ]; then
            find "$XC" -type f -iname "*.png" | while read -r f; do
              W=$(sips -g pixelWidth  "$f" 2>/dev/null | awk '/pixelWidth/{print $2}')
              H=$(sips -g pixelHeight "$f" 2>/dev/null | awk '/pixelHeight/{print $2}')
              if [ -n "$W" ] && [ -n "$H" ]; then
                BYTES=$(( W * H * 4 ))
                if [ "$BYTES" -gt 24000000 ]; then
                  echo "Reduciendo launch image demasiado grande: $f (${W}x${H}, $((BYTES/1000000))MB)"
                  sips -Z 2000 "$f" >/dev/null 2>&1 || true
                fi
              fi
            done
          fi
          npx cap sync ios
          # 3) FONDO DEL SPLASH SIN BORDES BLANCOS:
          #    La plantilla por defecto de Capacitor pone el fondo del
          #    LaunchScreen.storyboard como "systemBackgroundColor" (BLANCO en modo
          #    claro) -> se ven esquinas/bordes blancos durante el arranque.
          #    Sobrescribimos el storyboard con uno de fondo #0A0A0C explicito y la
          #    imagen Splash anclada a los 4 bordes (scaleAspectFill).
          SB="ios/App/App/Base.lproj/LaunchScreen.storyboard"
          if [ -f "native/LaunchScreen.storyboard" ] && [ -d "ios/App/App/Base.lproj" ]; then
            cp native/LaunchScreen.storyboard "$SB"
            echo "LaunchScreen.storyboard reemplazado por el de fondo oscuro."
          elif [ -f "$SB" ]; then
            # Fallback: forzar el color de fondo a #0A0A0C si no se pudo copiar.
            sed -i '' -E 's#<color key="backgroundColor"[^>]*systemColor="systemBackgroundColor"[^>]*/>#<color key="backgroundColor" red="0.0392156862745098" green="0.0392156862745098" blue="0.047058823529411764" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>#g' "$SB" || true
          fi
      - name: "Push APNs — reenvio del token en AppDelegate (CAUSA RAIZ)"
        script: |
          # MOTIVO por el que el token de push nunca llegaba al servidor:
          # la plantilla por defecto de Capacitor NO incluye los callbacks de APNs
          # en AppDelegate.swift. Resultado: iOS obtiene el token del dispositivo
          # pero nunca se lo entrega al plugin -> el JS no recibe 'registration' ni
          # 'registrationError' -> el token no se sube -> apns_devices vacio.
          # Insertamos los dos metodos oficiales (idempotente: solo si faltan) para
          # reenviar el token a Capacitor. No toca nada mas del AppDelegate, asi que
          # deep links / Sign in with Apple / Google siguen funcionando igual.
          APPDELEGATE="frontend/ios/App/App/AppDelegate.swift"
          if [ -f "$APPDELEGATE" ] && ! grep -q "didRegisterForRemoteNotificationsWithDeviceToken" "$APPDELEGATE"; then
            perl -0pi -e 's/(class AppDelegate[^\n]*\{)/$1\n\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n/' "$APPDELEGATE"
            echo "== AppDelegate parcheado con los callbacks de APNs push =="
            grep -n "RemoteNotifications" "$APPDELEGATE" || true
          else
            echo "AppDelegate ya tenia los callbacks de push (o no se encontro): $APPDELEGATE"
          fi
      - name: Ajustes Info.plist (encriptación + permiso de contactos) y solo-iPhone
        script: |
          PLIST="frontend/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption NO" "$PLIST"
          CONTACTS_MSG="Usamos tus contactos solo para ayudarte a encontrar amigos que ya usan ¿Quién va? e invitar a los que no. Nunca guardamos tu agenda."
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string $CONTACTS_MSG" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSContactsUsageDescription $CONTACTS_MSG" "$PLIST"
          # Permisos de camara / fotos / microfono. La app usa la camara (capturas del
          # momento, fotos en chats) y la galeria (foto de perfil, albumes de evento).
          # Sin estos textos iOS RECHAZA la app y ademas crashea al abrir la camara.
          CAM_MSG="Usamos la camara para que puedas hacer fotos y capturas del momento en las fiestas y compartirlas con tus amigos."
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string $CAM_MSG" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription $CAM_MSG" "$PLIST"
          PHOTO_MSG="Accedemos a tus fotos para que puedas subir tu foto de perfil y compartir fotos y videos en los albumes de eventos."
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string $PHOTO_MSG" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription $PHOTO_MSG" "$PLIST"
          PHOTO_ADD_MSG="Guardamos en tu galeria las fotos y videos que descargues o compartas desde ¿Quién va?"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string $PHOTO_ADD_MSG" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription $PHOTO_ADD_MSG" "$PLIST"
          MIC_MSG="Usamos el microfono cuando grabas un video para compartirlo en los albumes de eventos."
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC_MSG" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC_MSG" "$PLIST"
          # Custom URL scheme 'quienva://' — para que el login con Google (que se
          # abre en Safari del sistema) devuelva la sesion a la app. Idempotente:
          # borramos y re-anadimos para no duplicar en cada build.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string me.quienva.app" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string quienva" "$PLIST"
          # App SOLO para iPhone (evita tener que subir capturas de iPad)
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?1,2"?/TARGETED_DEVICE_FAMILY = "1"/g' frontend/ios/App/App.xcodeproj/project.pbxproj
          # Subir el iOS minimo a 15.0 (Apple exige >=15.0 a partir de 2027; aviso ITMS-90068).
          # Reemplaza CUALQUIER valor actual (p.ej. 14.0) por 15.0 en el proyecto...
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' frontend/ios/App/App.xcodeproj/project.pbxproj
          # ...y en el Podfile (para que los Pods se compilen tambien contra iOS 15).
          if [ -f frontend/ios/App/Podfile ]; then
            sed -i '' -E "s/platform :ios, *'[0-9.]+'/platform :ios, '15.0'/g" frontend/ios/App/Podfile
          fi
          echo "== Deployment target tras el parche ==" 
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" frontend/ios/App/App.xcodeproj/project.pbxproj | head -5 || true
      - name: "Sign in with Apple (entitlement)"
        script: |
          cd frontend/ios/App
          # 1) Copiar el archivo de entitlements con la capacidad com.apple.developer.applesignin
          cp ../../native/App.entitlements App/App.entitlements
          # 2) Referenciar el entitlements en el target de la app (Debug + Release)
          #    con la gema xcodeproj (viene incluida con CocoaPods) -> fiable, sin sed fragil.
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            raise "App target no encontrado" unless target
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            project.save
            puts "CODE_SIGN_ENTITLEMENTS asignado al target App (Sign in with Apple)"
          '
      - name: Preparar firma (automática con tu API Key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key @env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          # Apuntar SOLO al proyecto de la app (evita el conflicto con Pods.xcodeproj)
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Número de build automático
        script: |
          cd frontend/ios/App
          # Número de build = hora Unix (segundos). Siempre creciente y único,
          # así nunca colisiona con un build ya subido (evita el error 409
          # "bundle version must be higher"). Cabe de sobra bajo el límite de
          # Apple (< 4.294.967.295) hasta el año 2106.
          BUILD_NO=$(date +%s)
          echo "Usando número de build: $BUILD_NO"
          agvtool new-version -all "$BUILD_NO"
          # Versión visible (marketing). Se toma de la variable APP_VERSION para
          # que cada actualización sea solo cambiar ese número arriba.
          agvtool new-marketing-version "${APP_VERSION:-1.1}"
          echo "Versión marketing: ${APP_VERSION:-1.1}"
      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Sube el build a App Store Connect. Los TESTERS INTERNOS (tu cuenta del
        # equipo) pueden instalarlo desde TestFlight en cuanto se procesa, SIN
        # revisión de Apple y SIN rellenar la "Información de pruebas".
        # Lo dejamos en false a proposito: 'true' intentaria enviarlo a testers
        # EXTERNOS (beta review), que SI exige rellenar datos y hace fallar el paso.
        submit_to_testflight: false
        # submit_to_app_store: false     # cámbialo a true si quieres que Codemagic lo envíe a revisión solo
