        <!-- =========================================================
             Branded launch splash — ONLY inside the native app (Capacitor).
             The web (quienva.me) is untouched: #qv-splash stays display:none
             unless the <html> element gets the .qv-native class, which the
             tiny script below only adds when running in the native shell.
             React removes the overlay once the app has mounted.
        ========================================================== -->
        <style>
            #qv-splash{display:none}
            .qv-native #qv-splash{
                display:flex;position:fixed;inset:0;z-index:99999;
                flex-direction:column;align-items:center;justify-content:center;
                background:
                    radial-gradient(ellipse 90% 55% at 50% 30%, rgba(255,0,85,.14), transparent 60%),
                    #0A0A0C;
                transition:opacity .45s ease;
                padding-top:env(safe-area-inset-top);
                padding-bottom:env(safe-area-inset-bottom);
            }
            .qv-native #qv-splash.qv-hide{opacity:0;pointer-events:none}
            #qv-splash .qv-word{
                font-family:'Unbounded',-apple-system,BlinkMacSystemFont,sans-serif;
                font-weight:900;line-height:.98;letter-spacing:-.5px;text-align:center;
                font-size:clamp(40px,13vw,76px);
                opacity:0;animation:qvUp .6s cubic-bezier(.2,.8,.2,1) forwards;
            }
            #qv-splash .qv-l2{animation-delay:.12s}
            #qv-splash .qv-w{color:#fff}
            #qv-splash .qv-p{color:#FF0055}
            #qv-splash .qv-bar{
                margin-top:34px;width:110px;height:4px;border-radius:999px;
                background:rgba(255,255,255,.12);overflow:hidden;position:relative;
                opacity:0;animation:qvFade .5s ease .35s forwards;
            }
            #qv-splash .qv-bar::after{
                content:"";position:absolute;top:0;left:0;height:100%;width:40%;border-radius:999px;
                background:linear-gradient(90deg,#FF0055,#00F0FF);
                animation:qvSlide 1.1s ease-in-out infinite;
            }
            @keyframes qvUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
            @keyframes qvFade{to{opacity:1}}
            @keyframes qvSlide{0%{left:-40%}100%{left:110%}}
            @media (prefers-reduced-motion: reduce){
                #qv-splash .qv-word,#qv-splash .qv-bar{animation:none;opacity:1}
                #qv-splash .qv-bar::after{animation:none}
            }
        </style>
        <script>
            try{
                if(window.Capacitor && typeof window.Capacitor.isNativePlatform==="function" && window.Capacitor.isNativePlatform()){
                    document.documentElement.classList.add("qv-native");
                }
            }catch(e){}
        </script>
