<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0a0a0c" />
        <meta name="google-site-verification" content="RY9g-R-obFFpBLEoUMwkIzVS0sRN-BZhqCPffc297QA" />

        <!-- Faster image loads: pre-establish the TLS connection to Cloudinary -->
        <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
        <link rel="dns-prefetch" href="https://res.cloudinary.com" />
        <!-- Faster first API call: pre-establish the TLS connection to the backend -->
        <link rel="preconnect" href="https://quienva.onrender.com" crossorigin />
        <link rel="dns-prefetch" href="https://quienva.onrender.com" />
        <meta name="description" content="¿Quién va? — Descubre qué fiestas hay esta semana en tu ciudad y mira qué amigos van a cada una." />

        <!-- PWA / iOS -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
        <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
        <link rel="shortcut icon" href="/icons/icon-192.png" />
        <link rel="mask-icon" href="/icons/icon-512.png" color="#0a0a0c" />

        <!-- Canonical -->
        <link rel="canonical" href="https://www.quienva.me/" />

        <!-- Structured data: Organization + logo (Google Search logo/knowledge panel) -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "@id": "https://www.quienva.me/#organization",
            "name": "¿Quién va?",
            "alternateName": ["Quien va", "quienva.me", "QuienVa"],
            "url": "https://www.quienva.me/",
            "logo": {
                "@type": "ImageObject",
                "url": "https://www.quienva.me/icons/icon-512.png",
                "contentUrl": "https://www.quienva.me/icons/icon-512.png",
                "width": 512,
                "height": 512,
                "caption": "¿Quién va?"
            },
            "image": "https://www.quienva.me/icons/icon-512.png",
            "description": "Descubre las fiestas y discotecas de tu ciudad, mira qué amigos van y consigue tus entradas.",
            "sameAs": [
                "https://www.instagram.com/quienva.me",
                "https://www.tiktok.com/@quienva.me"
            ]
        }
        </script>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://www.quienva.me/#website",
            "name": "¿Quién va?",
            "url": "https://www.quienva.me/",
            "inLanguage": ["es", "en", "de"],
            "publisher": { "@id": "https://www.quienva.me/#organization" },
            "potentialAction": {
                "@type": "SearchAction",
                "target": {
                    "@type": "EntryPoint",
                    "urlTemplate": "https://www.quienva.me/feed?buscar={search_term_string}"
                },
                "query-input": "required name=search_term_string"
            }
        }
        </script>

        <!-- Open Graph / Social share (WhatsApp, Instagram, Twitter, etc.) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="¿Quién va?" />
        <meta property="og:title" content="¿Quién va? — Los planes del finde" />
        <meta property="og:description" content="Descubre las fiestas de esta semana y mira qué amigos van a cada una." />
        <meta property="og:image" content="https://www.quienva.me/icons/icon-512.png" />
        <meta property="og:image:width" content="512" />
        <meta property="og:image:height" content="512" />
        <meta property="og:url" content="https://www.quienva.me/" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="¿Quién va? — Los planes del finde" />
        <meta name="twitter:description" content="Descubre las fiestas de esta semana y mira qué amigos van a cada una." />
        <meta name="twitter:image" content="https://www.quienva.me/icons/icon-512.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>¿Quién va?</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>Necesitas activar JavaScript para usar esta app.</noscript>
        <div id="root"></div>
    </body>
</html>
